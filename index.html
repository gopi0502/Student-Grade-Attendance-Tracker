    // Generate historical attendance dates for past 10 weekdays
    const generateDemoAttendance = () => {
      const records = [];
      const dates = [
        "2026-10-12", "2026-10-13", "2026-10-14", "2026-10-15", "2026-10-16",
        "2026-10-19", "2026-10-20", "2026-10-21", "2026-10-22", "2026-10-23"
      ];
      
      let idCounter = 1;
      initialSubjects.forEach(sub => {
        dates.forEach(date => {
          initialStudents.forEach(stu => {
            // deterministic realistic attendance
            let status = "present";
            let note = "";
            const hash = (stu.id + date + sub.id).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            
            if (stu.id === "stu-7") { // George Bailey has low attendance
              if (hash % 3 === 0) status = "absent";
              else if (hash % 5 === 0) status = "late";
            } else if (stu.id === "stu-3") { // Carlos Mendoza has occasional late
              if (hash % 4 === 0) status = "late";
              else if (hash % 7 === 0) status = "absent";
            } else {
              if (hash % 19 === 0) {
                status = "absent";
                note = "Medical appointment";
              } else if (hash % 13 === 0) {
                status = "late";
                note = "Bus delay";
              } else if (hash % 23 === 0) {
                status = "excused";
                note = "Family event";
              }
            }

            records.push({
              id: `att-${idCounter++}`,
              date,
              subjectId: sub.id,
              studentId: stu.id,
              status,
              note
            });
          });
        });
      });
      return records;
    };

    // --- HELPER CALCULATIONS ---
    const getLetterGrade = (percentage) => {
      if (percentage >= 93) return { letter: "A", color: "text-emerald-700 bg-emerald-50 border-emerald-200", gpa: 4.0 };
      if (percentage >= 90) return { letter: "A-", color: "text-emerald-600 bg-emerald-50 border-emerald-200", gpa: 3.7 };
      if (percentage >= 87) return { letter: "B+", color: "text-blue-700 bg-blue-50 border-blue-200", gpa: 3.3 };
      if (percentage >= 83) return { letter: "B", color: "text-blue-600 bg-blue-50 border-blue-200", gpa: 3.0 };
      if (percentage >= 80) return { letter: "B-", color: "text-blue-500 bg-blue-50 border-blue-200", gpa: 2.7 };
      if (percentage >= 77) return { letter: "C+", color: "text-amber-700 bg-amber-50 border-amber-200", gpa: 2.3 };
      if (percentage >= 73) return { letter: "C", color: "text-amber-600 bg-amber-50 border-amber-200", gpa: 2.0 };
      if (percentage >= 70) return { letter: "C-", color: "text-amber-500 bg-amber-50 border-amber-200", gpa: 1.7 };
      if (percentage >= 60) return { letter: "D", color: "text-orange-600 bg-orange-50 border-orange-200", gpa: 1.0 };
      return { letter: "F", color: "text-rose-700 bg-rose-50 border-rose-200", gpa: 0.0 };
    };

    // --- MAIN APP COMPONENT ---

      const [attendance, setAttendance] = useState(() => {

      });

      // Save to localStorage on change
      useEffect(() => {

      }, [students]);

      useEffect(() => {

      }, [subjects]);

      useEffect(() => {

      }, [assessments]);

      useEffect(() => {
        localStorage.setItem("edutrack_grades", JSON.stringify(grades));
      }, [grades]);

      useEffect(() => {
        localStorage.setItem("edutrack_attendance", JSON.stringify(attendance));
      }, [attendance]);

      // Navigation & View state
      const [activeTab, setActiveTab] = useState("dashboard"); // dashboard, attendance, gradebook, students, subjects, reportcard
      const [toast, setToast] = useState(null);

      // Filter States
      const [selectedSubjectId, setSelectedSubjectId] = useState(subjects[0]?.id || "sub-1");
      const [attendanceDate, setAttendanceDate] = useState("2026-10-23");
      const [selectedStudentForReport, setSelectedStudentForReport] = useState(null);
      const [studentSearchQuery, setStudentSearchQuery] = useState("");
      const [statusFilter, setStatusFilter] = useState("all");

      // Modals
      const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);
      const [editingStudent, setEditingStudent] = useState(null);
      const [isAssessmentModalOpen, setIsAssessmentModalOpen] = useState(false);
      const [isSubjectModalOpen, setIsSubjectModalOpen] = useState(false);

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // --- DERIVED METRICS ---
      const studentMetrics = useMemo(() => {
        return students.map(student => {
          // Attendance metrics
          const studentAtts = attendance.filter(a => a.studentId === student.id);
          const totalAtt = studentAtts.length;
          const presentAtt = studentAtts.filter(a => a.status === "present").length;
          const lateAtt = studentAtts.filter(a => a.status === "late").length;
          const excusedAtt = studentAtts.filter(a => a.status === "excused").length;
          const absentAtt = studentAtts.filter(a => a.status === "absent").length;
          
          // Effective attendance percentage (Present = 100%, Late = 50%, Excused excluded or counted)
          const attendedEffective = presentAtt + (lateAtt * 0.6) + (excusedAtt * 0.9);
          const attendanceRate = totalAtt > 0 ? Math.round((attendedEffective / totalAtt) * 100) : 100;

          // Grades calculation across subjects
          const subjectGradeMap = {};
          subjects.forEach(sub => {
            const subAssessments = assessments.filter(a => a.subjectId === sub.id);
            if (subAssessments.length === 0) return;
            
            let totalWeight = 0;
            let weightedScoreSum = 0;

            subAssessments.forEach(ass => {
              const grade = grades.find(g => g.assessmentId === ass.id && g.studentId === student.id);
              if (grade && grade.score !== undefined) {
                const percentage = (grade.score / ass.maxScore) * 100;
                weightedScoreSum += percentage * ass.weight;
                totalWeight += ass.weight;
              }
            });

            if (totalWeight > 0) {
              const finalPct = Math.round(weightedScoreSum / totalWeight);
              subjectGradeMap[sub.id] = {
                percentage: finalPct,
                letter: getLetterGrade(finalPct)
              };
            }
          });

          // Overall Average Grade
          const subPcts = Object.values(subjectGradeMap).map(s => s.percentage);
          const overallAverage = subPcts.length > 0 
            ? Math.round(subPcts.reduce((a, b) => a + b, 0) / subPcts.length)
            : 0;

          const overallLetter = getLetterGrade(overallAverage);
          const isAtRisk = attendanceRate < 75 || (overallAverage > 0 && overallAverage < 60);

          return {
            ...student,
            attendanceRate,
            attendanceCounts: { total: totalAtt, present: presentAtt, late: lateAtt, absent: absentAtt, excused: excusedAtt },
            subjectGradeMap,
            overallAverage,
            overallLetter,
            isAtRisk
          };
        });
      }, [students, subjects, assessments, grades, attendance]);

      // Summary Stats
      const classStats = useMemo(() => {
        const total = students.length;
        if (total === 0) return { avgGrade: 0, avgAttendance: 0, atRiskCount: 0, highAchievers: 0 };

        const avgGrade = Math.round(studentMetrics.reduce((sum, s) => sum + s.overallAverage, 0) / total);
        const avgAttendance = Math.round(studentMetrics.reduce((sum, s) => sum + s.attendanceRate, 0) / total);
        const atRiskCount = studentMetrics.filter(s => s.isAtRisk).length;
        const highAchievers = studentMetrics.filter(s => s.overallAverage >= 90).length;

        return { avgGrade, avgAttendance, atRiskCount, highAchievers };
      }, [studentMetrics, students.length]);

      // --- ATTENDANCE HANDLERS ---
      const handleSetAttendanceStatus = (studentId, status) => {
        setAttendance(prev => {
          const existingIndex = prev.findIndex(a => a.studentId === studentId && a.date === attendanceDate && a.subjectId === selectedSubjectId);
          if (existingIndex >= 0) {
            const updated = [...prev];
            updated[existingIndex] = { ...updated[existingIndex], status };
            return updated;
          } else {
            return [...prev, {
              id: `att-${Date.now()}-${Math.random()}`,
              date: attendanceDate,
              subjectId: selectedSubjectId,
              studentId,
              status,
              note: ""
            }];
          }
        });
      };

      const handleSetAttendanceNote = (studentId, note) => {
        setAttendance(prev => {
          const existingIndex = prev.findIndex(a => a.studentId === studentId && a.date === attendanceDate && a.subjectId === selectedSubjectId);
          if (existingIndex >= 0) {
            const updated = [...prev];
            updated[existingIndex] = { ...updated[existingIndex], note };
            return updated;
          } else {
            return [...prev, {
              id: `att-${Date.now()}-${Math.random()}`,
              date: attendanceDate,
              subjectId: selectedSubjectId,
              studentId,
              status: "present",
              note
            }];
          }
        });
      };

      const handleBulkAttendance = (status) => {
        setAttendance(prev => {
          const map = new Map(prev.map(a => [`${a.studentId}_${a.date}_${a.subjectId}`, a]));
          students.forEach(stu => {
            const key = `${stu.id}_${attendanceDate}_${selectedSubjectId}`;
            if (map.has(key)) {
              map.set(key, { ...map.get(key), status });
            } else {
              map.set(key, {
                id: `att-${Date.now()}-${Math.random()}`,
                date: attendanceDate,
                subjectId: selectedSubjectId,
                studentId: stu.id,
                status,
                note: ""
              });
            }
          });
          return Array.from(map.values());
        });
        showToast(`Marked all students as "${status.toUpperCase()}" for ${attendanceDate}`);
      };

      // --- GRADE HANDLERS ---
      const handleUpdateGrade = (assessmentId, studentId, scoreValue) => {
        const numScore = scoreValue === "" ? undefined : Math.max(0, Number(scoreValue));
        setGrades(prev => {
          const existingIndex = prev.findIndex(g => g.assessmentId === assessmentId && g.studentId === studentId);
          if (existingIndex >= 0) {
            const updated = [...prev];
            if (numScore === undefined) {
              updated.splice(existingIndex, 1);
            } else {
              updated[existingIndex] = { ...updated[existingIndex], score: numScore };
            }
            return updated;
          } else if (numScore !== undefined) {
            return [...prev, {
              id: `g-${Date.now()}-${Math.random()}`,
              assessmentId,
              studentId,
              score: numScore
            }];
          }
          return prev;
        });
      };

      // --- STUDENT CRUD ---
      const handleSaveStudent = (studentData) => {
        if (studentData.id) {
          setStudents(prev => prev.map(s => s.id === studentData.id ? { ...s, ...studentData } : s));
          showToast(`Updated student ${studentData.name}`);
        } else {
          const newStudent = {
            ...studentData,
            id: `stu-${Date.now()}`,
            rollNo: studentData.rollNo || `STU-${String(students.length + 1).padStart(3, '0')}`,
            avatarBg: ["bg-indigo-500", "bg-emerald-500", "bg-amber-500", "bg-rose-500", "bg-purple-500", "bg-teal-500"][Math.floor(Math.random() * 6)]
          };
          setStudents(prev => [...prev, newStudent]);
          showToast(`Added new student ${newStudent.name}`);

        setIsStudentModalOpen(false);
        setEditingStudent(null);

      const handleDeleteStudent = (id, name) => {
        if (confirm(`Are you sure you want to delete ${name}? All attendance and grades for this student will be removed.`)) {

          setGrades(prev => prev.filter(g => g.studentId !== id));

          showToast(`Student ${name} deleted`, "info");

      const handleDeleteAssessment = (id, title) => {

          setSelectedSubjectId(newSub.id);
          showToast(`Created course: ${newSub.name}`);
        }
        setIsSubjectModalOpen(false);
      };

      // --- EXPORT & RESET DATA ---
      const exportCSV = (type) => {
        let csvContent = "data:text/csv;charset=utf-8,";
        if (type === "grades") {
          const currentSubject = subjects.find(s => s.id === selectedSubjectId);
          const subAssessments = assessments.filter(a => a.subjectId === selectedSubjectId);
          const headers = ["Roll No", "Student Name", ...subAssessments.map(a => `${a.title} (${a.maxScore}pts)`), "Final %", "Letter Grade"];
          csvContent += headers.join(",") + "\r\n";

          students.forEach(stu => {
            const metrics = studentMetrics.find(m => m.id === stu.id);
            const subData = metrics?.subjectGradeMap[selectedSubjectId];
            const row = [
              `"${stu.rollNo}"`,
              `"${stu.name}"`,
              ...subAssessments.map(ass => {
                const g = grades.find(x => x.assessmentId === ass.id && x.studentId === stu.id);
                return g && g.score !== undefined ? g.score : "";
              }),
              subData ? `${subData.percentage}%` : "N/A",
              subData ? subData.letter.letter : "N/A"
            ];
            csvContent += row.join(",") + "\r\n";
          });
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `Gradebook_${currentSubject?.code || "Subject"}_${new Date().toISOString().split("T")[0]}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast("Grades exported to CSV");
        } else if (type === "attendance") {
          const currentSubject = subjects.find(s => s.id === selectedSubjectId);
          const headers = ["Roll No", "Student Name", "Date", "Subject", "Status", "Note"];
          csvContent += headers.join(",") + "\r\n";

          const subAttendance = attendance.filter(a => a.subjectId === selectedSubjectId);
          subAttendance.forEach(att => {
            const stu = students.find(s => s.id === att.studentId);

                `"${stu.rollNo}"`,
                `"${stu.name}"`,
                att.date,
                `"${currentSubject?.name || ""}"`,
                att.status.toUpperCase(),
                `"${att.note || ""}"`

              csvContent += row.join(",") + "\r\n";
            }
          });
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `Attendance_${currentSubject?.code || "Subject"}_${new Date().toISOString().split("T")[0]}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast("Attendance exported to CSV");
        }

          assessments,
          grades,

        document.body.appendChild(downloadAnchor);

        downloadAnchor.remove();
        showToast("Full backup downloaded successfully");

              setSubjects(data.subjects);
              setAssessments(data.assessments || []);
              setGrades(data.grades || []);
              setAttendance(data.attendance || []);
              showToast("Data restored successfully!");
            } else {

            alert("Error parsing JSON file: " + err.message);

        };

        e.target.value = "";

                        placeholder="e.g. General Biology"
                        className="w-full px-3.5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block mb-1">Instructor Name *</label>
                    <input
                      name="instructor"
                      required
                      placeholder="e.g. Dr. Jane Goodall"
                      className="w-full px-3.5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block mb-1">Room or Schedule</label>
                    <input
                      name="room"
                      placeholder="e.g. Room 204, Mon/Wed 10am"
                      className="w-full px-3.5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-900 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setIsSubjectModalOpen(false)}
                      className="px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-xl transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow-md transition"
                    >
                      Create Course
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
